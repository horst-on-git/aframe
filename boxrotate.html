<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Box flies around sphere</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity position="0 1.5 -3">
        <a-sphere color="#EF2D5E" radius="0.6"></a-sphere>
        <a-entity position="1 0 0" rotation="0 0 0">
          <a-box color="#4CC3D9" width="0.5" height="0.5" depth="0.5"
                 animation__position="property: position; dur: 4000; loop: true; to: 1 0 0; easing: linear"
                 animation__rotation="property: rotation; dur: 5000; loop: true; to: 0 360 0"></a-box>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
