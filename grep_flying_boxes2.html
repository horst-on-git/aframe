    <script>
    let grabbedCount = 0;
    let missedCount = 0;

    AFRAME.registerComponent('physics-grab', {
      init: function () {
        const self = this;

        this.el.addEventListener("raycaster-grabbed", function () {
          self.el.addState("grabbed");
          self.changeColor();
        });

        this.el.addEventListener("raycaster-released", function () {
          if (self.el.is("grabbed")) {
            grabbedCount++;
            self.el.removeState("grabbed");
          } else {
            missedCount++;
          }
          updateCounters();
        });

        this.el.addEventListener("animationcomplete__colorChange", function () {
          self.el.parentNode.removeChild(self.el);
        });
      },

      changeColor: function () {
        this.el.setAttribute("animation__colorChange", "property: material.color; to: black; dur: 300; easing: easeInOutCubic");
        setTimeout(() => {
          this.el.parentNode.removeChild(this.el); // Remove the box after 1 second!
        }, 200);
      }
    });

    function updateCounters() {
      console.log(`Grabbed: ${grabbedCount}, Missed: ${missedCount}`);
    }
  </script>
    <script>
