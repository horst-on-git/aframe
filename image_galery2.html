<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>360&deg; Image Gallery</title>
    <meta name="description" content="360&deg; Image Gallery - A-Frame">
    <!-- If running this example without a local copy of A-Frame, replace this next line with:
    <script src="https://aframe.io/releases/<release_number>/aframe.min.js"></script>
    -->
    <script src="../../../dist/aframe-master.js"></script>
    <script src="https://unpkg.com/aframe-template-component@3.x.x/dist/aframe-template-component.min.js"></script>
    <script src="https://unpkg.com/aframe-layout-component@4.x.x/dist/aframe-layout-component.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-proxy-event-component@2.1.0/dist/aframe-proxy-event-component.min.jss"></script>
    
    <!-- Image link template to be reused. -->
    <script id="link" type="text/html">
      <a-entity class="link"
        geometry="primitive: plane; height: 1; width: 1"
        material="shader: flat; src: ${thumb}"
        sound="on: click; src: #click-sound"
        event-set__mouseenter="scale: 1.2 1.2 1"
        event-set__mouseleave="scale: 1 1 1"
        event-set__click="_target: #image-360; _delay: 300; material.src: ${src}"
        proxy-event="event: click; to: #image-360; as: fade"></a-entity>
    </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="city" crossorigin="anonymous" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg">
        <img id="city-thumb" crossorigin="anonymous" src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/BrooklynBridge.jpg?v=1681638491855">
        <img id="speicher-thumb" crossorigin="anonymous" src="https://cdn.glitch.global/390e6692-91b4-41c8-a4b6-d09adbc8e9fb/speicher_360_klein.jpg?v=1678460894819">
        <img id="grunewald-thumb" crossorigin="anonymous" src="https://cdn.glitch.global/390e6692-91b4-41c8-a4b6-d09adbc8e9fb/Grunewald_foto.jpg?v=1678459183421">
        <img id="grunewald" crossorigin="anonymous" src="https://cdn.glitch.global/390e6692-91b4-41c8-a4b6-d09adbc8e9fb/Grunewald_foto.jpg?v=1678459183421">
        <img id="cubes-thumb" crossorigin="anonymous" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/thumb-cubes.jpg">
        <img id="sechelt-thumb" crossorigin="anonymous" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/thumb-sechelt.jpg">
        <audio id="click-sound" crossorigin="anonymous" src="https://cdn.aframe.io/360-image-gallery-boilerplate/audio/click.ogg"></audio>
        <img id="speicher" crossorigin="anonymous" src="https://cdn.glitch.global/390e6692-91b4-41c8-a4b6-d09adbc8e9fb/speicher_360_klein.jpg?v=1678460894819">
        <video id="3dvideo" preload="auto"   
               src="https://cdn.glitch.global/390e6692-91b4-41c8-a4b6-d09adbc8e9fb/dach_360_klein.mp4?v=1678462500289" 
               width="640" height="360" autoplay loop="true"
               ></video>
        <img id="sechelt" crossorigin="anonymous" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg">
      <img id="pause" src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/pause.png?v=1706813724203">
      <img id="play" src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/play.jpg?v=1706813732039">
      </a-assets>
      
     
     
     <a-videoshere src="#3dvideo" rotation="0 -90 0">  </a-videoshere> 
      <a-camera> 
        <a-cursor> </a-cursor>
      </a-camera>
 
    </a-scene>
  </body>
</html>
