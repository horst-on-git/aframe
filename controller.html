<!DOCTYPE html>
<html>
<!--
        Content:
        Author: 
        URL: https://github.com/stemkoski/A-Frame-Examples/blob/master/text-2D.html 
			https://github.com/stemkoski/A-Frame-Examples/blob/master/quest-controllers.html		
        -->

<head>
	<title>A-Frame: Quest controller data demo</title>
	<meta name="description" content="Hello, WebVR! - A-Frame">
	<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/controller-listener.js?v=1682691154923"></script>

</head>

<body>
<script>

AFRAME.registerComponent('updater', {
	
	init: function()
	{
		this.num = 0;
    this.controllerData = document.querySelector("#controller-data").components["controller-listener"];
		this.text = "";
	},
	
	tick: function (time, timeDelta) 
	{
		this.num += 1;
		this.el.setAttribute("text", "value", "Tick counter: " + this.num)
		if (this.controllerData.rightTrigger.pressing == true) { 
      this.text = "\n" + "Right Controller pressed!! We are pausing" + "\n" 
			this.el.setAttribute( "text", "value", this.text );
      
			// pause();
			}

	}
	
});

</script>
<script>
AFRAME.registerComponent('text-display', {
	
	init: function()
	{
		this.controllerData = document.querySelector("#controller-data").components["controller-listener"];
		this.text = "";
	},

	tick: function()
	{
		this.text = 
		           "Left Controller:" + "\n" +
		           "Joystick X: " + this.controllerData.leftAxisX + "\n" +
		           "Joystick Y: " + this.controllerData.leftAxisY + "\n" + 
		           "[Y] Button: " + this.controllerData.buttonY.pressing + "\n" +
		           "[X] Button: " + this.controllerData.buttonX.pressing + "\n" +
		           "   Trigger: " + this.controllerData.leftTrigger.pressing + "\n" +
		           "      Grip: " + this.controllerData.leftGrip.pressing + "\n" +
		           "----------------------------------- \n" +
		           "Right Controller:" + "\n" +
		           "Joystick X: " + this.controllerData.rightAxisX + "\n" +
		           "Joystick Y: " + this.controllerData.rightAxisY + "\n" +
		           "[B] Button: " + this.controllerData.buttonB.pressing + "\n" +
		           "[A] Button: " + this.controllerData.buttonA.pressing + "\n" +
		           "   Trigger: " + this.controllerData.rightTrigger.pressing + "\n" +
		           "      Grip: " + this.controllerData.rightGrip.pressing + "\n";
		           
		this.el.setAttribute( "text", "value", this.text );
	},
	
});
</script>

<a-scene renderer="antialias: true;">
		
	<a-sky 
		color = "#001337">
	</a-sky>

	<a-entity 
	    id="controller-data" 
	    controller-listener="leftControllerId:  #left-controller; 
	                         rightControllerId: #right-controller;">
	</a-entity>

	<a-entity 
	    id="left-controller"
	    oculus-touch-controls="hand: left">
    </a-entity>
	<a-entity
		id="right-controller"
	    oculus-touch-controls="hand: right">
	</a-entity>

	<a-plane
		width="100" height="100"
		position=" 0.00 0.00 0.00" 
		rotation="-90 0 0" 
		color="#666666"
		shadow="cast: false; receive: true">
	</a-plane>

	<a-torus-knot 
		p="2" q="3" radius="0.5" radius-tubular="0.1"
		position = "-2.5 1.5 -4"
		color="#CC3333" 
		shadow = "cast: true; receive: true">
	</a-torus-knot>
	
	<a-box
		width = "2" height = "1" depth = "1"
		position = "-1 0.5 -3"
		rotation = "0 45 0"  
		color = "#FF8800"
		shadow = "cast: true; receive: true">
	</a-box>
	
	<a-sphere
		radius = "1.25"
		position = "0 1.25 -5"
		color = "#DDBB00"
		shadow = "cast: true; receive: true">
	</a-sphere>
	
	<a-cylinder
		radius = "0.5" height = "1.5"
		position = " 1 0.75 -3"
		color = "#008800" 
		shadow = "cast: true; receive: true">
	</a-cylinder>

	<a-cone
		radius-bottom = "1" radius-top = "0" height = "2"
		position = "3 1 -4"
		color = "#4444CC"
		shadow = "cast: true; receive: true">
	</a-cone>
	
	<a-torus 
		radius="0.5" radius-tubular="0.1"
		position = "2 3 -4"
		rotation = "30 -20 0"
		color="#8800FF"
		shadow = "cast: true; receive: true">
	</a-torus>

	<a-entity
		id="textArea"
		position="-2 1.5 -1.9"
		geometry="primitive: plane;  width: 3; height: auto"
		material="color: #444444; transparent: true; opacity: 0.80;"
		text="anchor: center; baseline: center; wrapCount: 40;
				transparent: true; opacity: 0.90; color: #8888FF;
				value: 1 \n 2 \n 3 \n 4"
		text-display>
	</a-entity>

	<a-entity
		id="textArea"
		position="1.9 3 -2"
		geometry="primitive: plane; width: 3; height:auto"
		material="color: #444444; transparent: true; opacity: 0.80;"
		text="anchor: center; baseline: center; wrapCount: 30;
				transparent: true; opacity: 0.90; color: #AAAAFF;
				value: Tick Counter: ???"
		updater>
	</a-entity>


</a-scene>

</body>
</html>
