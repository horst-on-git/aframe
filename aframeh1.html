<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <meta charset="utf-8" />
    <title></title>
  </head>
  <body>
    <a-scene embedded>
      <a-entity geometry="primitive: cylinder,height: 2; radius: 1"></a-entity>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="yellow"></a-box>
      <a-entity>
        <a-box position="-1 1.01 -3" rotation="0 45 0" color="blue"></a-box>
        <a-box position="-0.98 1 -3" rotation="0 45 0" color="black"></a-box>
      </a-entity>
      <a-entity
        position="0.4 1.4 -0.234"
        rotation="-0.01 0.06 0"
        scale="0.14 0.9 0.16"
      >
        <a-box
          position="-1 1.01 -0.2"
          rotation="0 45 0"
          color="blue"
          scale="0.2 1 1"
        ></a-box>
        <a-box
          position="-0.98 1 -0.1"
          rotation="0 45 0"
          color="black"
          scale="0.2 1 1"
        ></a-box>
      </a-entity>
      <a-sphere position="0 1.25 -5" radius="1.0" color="#EF2D5E"></a-sphere>
      <a-entity>
        <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
        <a-cylinder
          position="1 0.75 -3"
          radius="0.5"
          height="1.5"
          color="#FFC65D"
        ></a-cylinder>
      </a-entity>
      <a-entity>
        <a-sphere
          position="0.8 1.25 -5"
          radius="1.25"
          color="#EF2D5E"
        ></a-sphere>
        <a-cylinder
          position="1.8 0.75 -3"
          radius="0.5"
          height="1.5"
          color="#FFC65D"
        ></a-cylinder>
      </a-entity>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4"
      ></a-plane>
      <a-sky
        src="#sky-1"
        animation__fadein="startEvents: fadein; property: material.opacity; from: 0; to: 1; dur: 1000;"
        animation__fadeout="startEvents: fadeout; property: material.opacity; from: 1; to: 0; dur: 1000;"
      >
      </a-sky>
    </a-scene>
  </body>
</html>
