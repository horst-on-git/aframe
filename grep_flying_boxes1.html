<!DOCTYPE html>
<html>
<head>
  <title>A-Frame Würfel-Spiel für Pico 4</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-entity id="camera" position="0 1.6 -3" look-controls wasd-controls></a-entity>

    <a-entity id="cube1" geometry="primitive: box; width: 0.5; height: 0.2; depth: 0.5" 
              material="color: red"
              dynamic-body="mass: 1"
              position="-2 2 -5"
              velocity="0 0 0.5"
              movement="speed: 0.02">
    </a-entity>
    <a-entity id="cube2" geometry="primitive: box; width: 0.2; height: 0.5; depth: 0.2" 
              material="color: yellow"
              dynamic-body="mass: 1"
              position="0 2 -5"
              velocity="0 0 -0.5">
    </a-entity>
    <a-entity id="cube3" geometry="primitive: box; width: 0.6; height: 0.6; depth: 0.6" 
              material="color: blue"
              dynamic-body="mass: 1"
              position="2 2 -5"
              velocity="0 0 0.3">
    </a-entity>
    <a-entity id="left-hand" raycaster="objects: .collidable; far: 10; showLine: true" oculus-touch-controls="hand: left"></a-entity>
    <a-entity id="right-hand" raycaster="objects: .collidable; far: 10; showLine: true" oculus-touch-controls="hand: right"></a-entity>

    <a-entity id="counter" position="-2 3 -3" text="value: 0; align: center; width: 5"></a-entity>
  </a-scene>

  <script>
    AFRAME.registerComponent('movement', {
      tick: function () {
        var el = this.el;
        el.object3D.position.x += Math.random() * 0.01 - 0.005;
        el.object3D.position.y += Math.random() * 0.01 - 0.005;
        el.object3D.position.z += Math.random() * 0.01 - 0.005;
      }
    });

    AFRAME.registerComponent('hit', {
      init: function () {
        var el = this.el;
        el.addEventListener('raycaster-intersection', function (evt) {
          evt.detail.intersectedEl.setAttribute('material', 'color: black');
          evt.detail.intersectedEl.setAttribute('scale', '1.5 1.5 1.5');
          setTimeout(() => {
            evt.detail.intersectedEl.setAttribute('visible', false);
            document.querySelector('#counter').setAttribute('text', {value: parseInt(document.querySelector('#counter').getAttribute('text').value) + 1});
          }, 300);
        });
      }
    });

    document.querySelectorAll('.collidable').forEach(el => el.setAttribute('hit', ''));
  </script>
</body>
</html>
