<html>
  <head>
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="//cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  </head>
  <body>
    <a-scene background="color: grey">
      <a-assets>
        <img id="brooklynbridge" src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/BrooklynBridge.jpg?v=1681638491855">
        <img id="wallstreet" src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/WallStreet.jpg?v=1681638498605">
        <img id="molinos" src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/D_1997.jpg?v=1681493673749">
        <img id="soil" src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/soil.jpg?v=1681493471258">
        <img id="bands" src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/bands.jpg?v=1681493722420">
        <img id="plaza-360" src="https://cdn.glitch.global/a4f90acb-36ae-41ca-bd4a-d9b8429569bb/plaza-360.jpg?v=1681493483224">
      </a-assets>
      
      <a-box position="3.5 1 -3" rotation="0 90 0" scale="2 2 2" src="#molinos"
             animation="property: position; to: 5.5 1 -5;
                        dir: alternate; dur: 3000;
                        loop: true">
      </a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" src="#plaza-360"
			animation="property: position; to: 5.5 1 -5;
                        dir: alternate; dur: 3000;
                        loop: true">
	  
	    </a-sphere>
       <a-cylinder height="6.0" radius="5" theta-length="70" open-ended="true"
        side="double" position="0 3 -4" rotation="0 140 0" src="#wallstreet"
        ></a-cylinder>
      
      <a-curvedimage height="6.0" radius="5" theta-length="70"
        position="0 3 -4" rotation="0 60 0" src="#wallstreet"></a-curvedimage>
      
      <a-entity
          geometry="primitive: cylinder; height: 6.0; radius: 5;
            theta-length: 70; open-ended: true"
          position="0 3 -4"
          rotation="0 220 0"
          material="src: #brooklynbridge; side: double">
      </a-entity>
      
      
      <a-cylinder position="1 1.25 -3" radius="0.5" height="2.5" src="#bands"
			animation="property: position; to: 1 2 -3;
                        dir: alternate; dur: 3000;
                        loop: true">
      </a-cylinder>
	    


	    <a-entity
        geometry="primitive: box"
        material="color: red"
        position="1 2.25 -3"
        animation__mouseenter="property: components.material.material.color; type: color; to: blue; startEvents: mouseenter; dur: 500";
        animation__mouseleave="property: components.material.material.color; type: color; to: red; startEvents: mouseleave; dur: 500";>
      </a-entity>
	  
	    <a-entity
        geometry="primitive: box"
        material="color: grey"
        position="1 1.25 -3"
        animation__mouseenter="property: components.material.material.color; type: color; to: blue; startEvents: mouseenter; dur: 500";
        animation__mouseleave="property: components.material.material.color; type: color; to: red; startEvents: mouseleave; dur: 500";
        animation="property: position; to: 1 2 -3;
                          dir: alternate; dur: 3000;
                          loop: true">
      </a-entity>
      
      <a-text value="Just a simple puups" color="red"
          position="-3.5 0.3 -2" rotation="-45 30 0" scale="2.5 2.5 2.5"
                >
      </a-text>
			  
      <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="4"
               repeat="4 2" src="#soil"></a-plane>


      <a-light type="ambient" color="grey"></a-light>
      <a-light type="point" intensity="2" position="-2 2 4"></a-light>
	    
      
       <a-entity position="-3 1 1" rotation="0 -25 0">
        <a-camera>
          <a-cursor></a-cursor>
        </a-camera>
      </a-entity>
      


	  
	  
      <script>
        var sphere = document.querySelector('a-sphere');
        sphere.addEventListener('mouseenter', function () {
          sphere.setAttribute('radius', "2");
        });
        sphere.addEventListener('mouseleave', function () {
          sphere.setAttribute('radius', "1");
        });
       </script>
    </a-scene>
  </body>
</html>
