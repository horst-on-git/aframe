<html>
<head>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <meta charset="utf-8" />
    <title></title>
</head> 
<body>
    <a-scene embedded>
		 <a-assets>
			<img id="sky" src="Grunewald_foto.jpg">
		 </a-assets>
		 <a-sky src="#sky"></a-sky>
		<a-entity position="0 1.5 -3" material="opacity: 0.0; transparent: true">
        <a-sphere color="#EF2D5E" radius="0.6"></a-sphere>
        <a-entity position="1 0 0" rotation="0 0 0">
          <a-box color="#4CC3D9" width="0.5" height="0.5" depth="0.5"
                 animation__position="property: position; dur: 4000; loop: true; to: 1 0 0; easing: linear"
                 animation__rotation="property: rotation; dur: 5000; loop: true; to: 0 360 0"></a-box>
			</a-entity>
		</a-entity>
         
		 
    </a-scene>
</body>
</html>
